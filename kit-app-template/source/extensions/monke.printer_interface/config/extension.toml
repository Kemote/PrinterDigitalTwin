[package]
title = "3D Printer Digital Twin"
version = "0.1.1"  # Semantic Versioning is used: https://semver.org/
description = "This extension is built to gather telemetry data from an OctoPrint server and a cam_tracker server, and use it for the visual representation of a printer digital twin over WebRTC or inside Omniverse."
category = "Telemetry"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["kit", "example", "extension"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI
repository = "https://github.com/NVIDIA-Omniverse/kit-app-template"  # URL of the extension source repository


[dependencies]


[settings]


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import monke.printer_interface"
name = "monke.printer_interface"

[[python.module]]
path = "pip_prebundle"

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
]

args = [
]